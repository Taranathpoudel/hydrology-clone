{% extends "base.html" %}
{% block title %}River Watch{% endblock %}
{% block content %}

<section class="panel">
  <header class="panel-head">
    <h2>River Watch</h2>
    <div class="controls">
      <input id="q" placeholder="Search station, basin, district…">
      <select id="trend">
        <option value="all">All trends</option>
        <option value="RISING">Rising</option>
        <option value="FALLING">Falling</option>
        <option value="STEADY">Steady</option>
      </select>
      <select id="sort">
        <option value="diff_warning_desc">Warning Δ (closest first)</option>
        <option value="diff_warning_asc">Warning Δ (safest first)</option>
        <option value="water_desc">Water level high→low</option>
        <option value="water_asc">Water level low→high</option>
        <option value="name_asc">Name A→Z</option>
      </select>
    </div>
  </header>
  <div class="table-wrap">
    <table class="data" id="rw-table">
      <thead>
        <tr>
          <th>#</th><th>Station</th><th>Basin</th><th>District</th>
          <th>Water</th><th>Warning</th><th>Danger</th>
          <th>Warning Δ</th><th>Danger Δ</th><th>Trend</th><th>Status</th>
        </tr>
      </thead>
      <tbody><tr><td colspan="11" class="empty">Loading…</td></tr></tbody>
    </table>
  </div>
</section>

{% endblock %}
{% block scripts %}
<script>DHM.renderRiverWatch();</script>
{% endblock %}
